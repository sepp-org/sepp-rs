# git-cliff configuration. Generates a categorized changelog from
# Conventional Commits since the previous tag.
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first | split(pat="\\n") | first }}\
  {% if commit.breaking %} **(breaking)**{% endif %}\
  {% if commit.github.username %} (@{{ commit.github.username }}){% endif %}\
{% endfor %}\
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Drop commits that don't follow the convention so the changelog stays clean.
filter_unconventional = true
split_commits = false
# Map commit prefixes to changelog sections. Note: the body template's
# group_by sorts groups alphabetically ("Bug Fixes" < "Features" <
# "Performance"), so the order below has no effect on the rendered output.
commit_parsers = [
    { message = "^feat",     group = "Features" },
    { message = "^fix",      group = "Bug Fixes" },
    { message = "^perf",     group = "Performance" },
    { message = "^docs",     skip = true },
    { message = "^refactor", skip = true },
    { message = "^test",     skip = true },
    { message = "^build",    skip = true },
    { message = "^ci",       skip = true },
    { message = "^chore",    skip = true },
    { message = "^style",    skip = true },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
