version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      tonic:
        patterns:
          - "tonic*"
          - "prost*"
      tracing:
        patterns:
          - "tracing"
          - "tracing-subscriber"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
