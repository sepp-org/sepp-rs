[package]
name = "sepp-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
include = ["src/**/*.rs", "proto/**/*.proto", "build.rs"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["derive"] }
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
uuid = { version = "1.23.1", features = ["v4"] }
futures = "0.3.32"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Only the `traced` example uses these (see [[example]] below). The exporter
# deliberately lives in the host app, not the library.
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "trace"] }

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
prost-reflect-build = "0.16"
protoc-bin-vendored = "3"

[features]
default = ["opentelemetry"]
opentelemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
tls = ["tonic/tls-ring", "tonic/tls-native-roots"]

[[example]]
name = "traced"
required-features = ["opentelemetry"]
