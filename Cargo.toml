[package]
name = "sepp-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "The official Rust client for sepp, a small, language-agnostic durable job queue"
repository = "https://github.com/sepp-org/sepp-rs"
documentation = "https://docs.rs/sepp-rs"
readme = "README.md"
keywords = ["sepp", "job-queue", "queue", "worker", "grpc"]
categories = ["asynchronous", "network-programming"]
include = ["src/**/*.rs", "proto/**/*.proto", "build.rs", "README.md", "LICENSE"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
uuid = { version = "1.23.1", features = ["v4"] }
futures = "0.3.32"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.44"
gethostname = "1.1.0"

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Only the `traced` example uses these (see [[example]] below). The exporter
# deliberately lives in the host app, not the library.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
testcontainers = "0.27"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"

[features]
default = ["opentelemetry"]
opentelemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
tls = ["tonic/tls-ring", "tonic/tls-native-roots"]

[[example]]
name = "traced"
required-features = ["opentelemetry"]
