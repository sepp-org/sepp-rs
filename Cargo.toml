[package]
name = "sepp-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14"
prost-reflect = { version = "0.16", features = ["derive"] }
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
opentelemetry = { version = "0.3", optional = true }
uuid = "1.23.1"
futures = "0.3.32"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
prost-reflect-build = "0.16"
protoc-bin-vendored = "3"

[features]
default = []
opentelemetry = ["dep:opentelemetry"]
